# On each version tag, pack the skill as the zip claude.ai expects and attach it to the tag's release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The skill's name, from the frontmatter of SKILL.md, names the zip and its folder.
      - name: 👀 Read the skill's name
        run: |
          name=$(sed -n '2,/^---/{s/^name:[[:space:]]*//p}' SKILL.md | head -n 1 | tr -d "\"'\r ")
          [[ $name =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::No valid skill name in the frontmatter of SKILL.md: '$name'"; exit 1; }
          echo "SKILL_NAME=$name" >> "$GITHUB_ENV"

      # claude.ai wants the skill's folder, named after the skill, at the top of the zip.
      - name: 📦 Pack the skill
        run: |
          # What the skill's zip leaves out: the tracked files and directories marked with the skill-ignore attribute.
          # Git does not carry an attribute from a directory to its files, so each file's directories are checked too.
          mapfile -t ignored < <(git ls-files | awk '{ print; while (sub(/\/[^\/]*$/, "")) print }' | sort -u | git check-attr --stdin skill-ignore | sed -n 's/: skill-ignore: set$//p')
          args=(); for path in "${ignored[@]}"; do args+=(":(exclude,literal)$path"); done
          git archive --prefix="$SKILL_NAME/" -o "$SKILL_NAME.zip" HEAD -- . "${args[@]}"

      - name: 🧪 Check the zip
        run: |
          unzip -l "$SKILL_NAME.zip"
          unzip -l "$SKILL_NAME.zip" | grep -q -- " $SKILL_NAME/SKILL\.md\$"

      # Re-running on an existing release replaces its zip.
      - name: 📤 Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$SKILL_NAME.zip" --clobber
          else
            gh release create "$TAG" "$SKILL_NAME.zip" --title "$TAG" --generate-notes --verify-tag
          fi
