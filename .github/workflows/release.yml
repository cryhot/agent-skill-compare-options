# On each version tag, pack the skill as the zip claude.ai expects and attach it to the tag's release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The skill's name, from the frontmatter of SKILL.md, names the zip and its folder.
      - name: 👀 Read the skill's name
        run: |
          name=$(sed -n '2,/^---/{s/^name:[[:space:]]*//p}' SKILL.md | head -n 1 | tr -d "\"'\r ")
          [[ $name =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::No valid skill name in the frontmatter of SKILL.md: '$name'"; exit 1; }
          echo "SKILL_NAME=$name" >> "$GITHUB_ENV"

      # The version the table script says it is (which widgets load from the tag) must be the tag's.
      - name: 🔖 Check the script's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n "s/^  const VERSION = '\(.*\)';.*/\1/p" assets/compare-table.js)
          [[ v$version == "$TAG" ]] || { echo "::error::assets/compare-table.js says version '$version', and the tag is $TAG: set VERSION in the tagged commit"; exit 1; }

      # claude.ai wants the skill's folder, named after the skill, at the top of the zip.
      - name: 📦 Pack the skill
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # What the skill's zip leaves out: the tracked files and directories marked with the skill-ignore attribute.
          # Git does not carry an attribute from a directory to its files, so each file's directories are checked too.
          mapfile -t ignored < <(git ls-files | awk '{ print; while (sub(/\/[^\/]*$/, "")) print }' | sort -u | git check-attr --stdin skill-ignore | sed -n 's/: skill-ignore: set$//p')
          args=(); for path in "${ignored[@]}"; do args+=(":(exclude,literal)$path"); done
          # A tiny README, in place of the repository's, points back to the repository at this version.
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          printf '# %s\n\nVersion [%s](%s/tree/%s) of the skill: %s\n' "$SKILL_NAME" "$TAG" "$repo_url" "$TAG" "$repo_url" > "$RUNNER_TEMP/README.md"
          git archive --prefix="$SKILL_NAME/" --add-file="$RUNNER_TEMP/README.md" -o "$SKILL_NAME.zip" HEAD -- . "${args[@]}"

      - name: 🧪 Check the zip
        run: |
          unzip -l "$SKILL_NAME.zip"
          unzip -l "$SKILL_NAME.zip" | grep -q -- " $SKILL_NAME/SKILL\.md\$"

      # Re-running on an existing release replaces its zip.
      - name: 📤 Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$SKILL_NAME.zip" --clobber
          else
            gh release create "$TAG" "$SKILL_NAME.zip" --title "$TAG" --generate-notes --verify-tag
          fi

      # The ranges the tag moves: its major version, which widgets load the table script from (eg. 1),
      # and its minor version, which only gets the patches (eg. 1.1).
      - name: 👀 Read the version ranges
        env:
          TAG: ${{ github.ref_name }}
        run: |
          IFS=. read -r major minor _ <<< "${TAG#v}"
          echo "MAJOR=$major" >> "$GITHUB_ENV"
          echo "MINOR=$major.${minor:-0}" >> "$GITHUB_ENV"

      # Make the CDN serve the new version for those ranges now, instead of within 7 days.
      # Each file is tried even when another fails; failures show as warnings, and do not fail the release.
      - name: 🧽 Purge jsDelivr
        continue-on-error: true
        env:
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          # Each script, and the minified copy jsDelivr makes of it.
          declare -A paths
          for file in assets/*.js; do
            paths[$file]=1
            [[ $file == *.min.js ]] || paths[${file%.js}.min.js]=1
          done
          failed=0
          for range in "$MAJOR" "$MINOR"; do
            for path in "${!paths[@]}"; do
              url="https://purge.jsdelivr.net/gh/$REPO@$range/$path"
              if ! curl -fsS --retry 3 --retry-all-errors --max-time 30 "$url"; then
                echo "::warning::Could not purge $url"
                failed=1
              fi
            done
          done
          exit "$failed"
